<style>
/* Layout: one column; person switch, that person's bag allowances, bag filter, then category groups of checkable rows (qty + which bag). */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --fg:#17231f; --muted:#5a6b65; --line:#d9e2de;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101715; --surface:#17211e; --fg:#e4ece9; --muted:#97a8a2; --line:#2a3833;
  --jade:#5ec7b1; --jade-soft:#173a33; --lantern:#f08a5d; --lantern-soft:#3d2216;
  --done:#5f6e69; --warnbg:#33290f; --warn:#f0c870; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101715; --surface:#17211e; --fg:#e4ece9; --muted:#97a8a2; --line:#2a3833;
  --jade:#5ec7b1; --jade-soft:#173a33; --lantern:#f08a5d; --lantern-soft:#3d2216;
  --done:#5f6e69; --warnbg:#33290f; --warn:#f0c870; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0;line-height:1.15;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px}
.who button{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:9px;padding:10px 8px;background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.who button small{font-weight:400;font-size:.8rem}
.who button[aria-pressed="true"]{background:var(--jade);color:var(--surface)}
.bags{display:flex;flex-wrap:wrap;gap:8px}
.bag{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.bag b{font-variant-numeric:tabular-nums}
.bag span{color:var(--muted);font-size:.85rem}
.tips{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.92rem}
.tips ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:3px}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.prog b{font-family:var(--display);font-weight:400;font-size:1.35rem;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--jade);transition:width .3s}
.sync{font-size:.82rem;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:5px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft);color:var(--jade);font-weight:700}
section.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cat h2{font-size:1rem;margin:0;padding:10px 14px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);font-weight:700}
.cat h2 span{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.cat ul{list-style:none;margin:0;padding:0}
.cat li+li{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:10px 14px;cursor:pointer}
.item input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--jade);cursor:pointer}
.item .nm{min-width:0}
.item .nm b{font-weight:600}
.item .nt{display:block;color:var(--muted);font-size:.85rem}
.item .meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.qty{font-weight:700;font-variant-numeric:tabular-nums;color:var(--lantern);background:var(--lantern-soft);border-radius:6px;padding:0 8px;white-space:nowrap;font-size:.92rem}
.tag{font-size:.75rem;color:var(--muted);white-space:nowrap}
.item.done .nm b,.item.done .nt{color:var(--done);text-decoration:line-through}
.item.done .qty{opacity:.5}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:9px;padding:8px 14px;cursor:pointer}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--lantern-soft);border-radius:9px;padding:8px 12px}
.confirm button.yes{background:var(--lantern);color:var(--surface);border-color:var(--lantern)}
.foot{color:var(--muted);font-size:.85rem;margin:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

  <div class="tips" id="tips"></div>

    <div class="bar"><i id="barfill"></i></div>
  </div>

  <div class="filters" id="filters" role="group" aria-label="סינון לפי תיק"></div>

  <div id="list" style="display:flex;flex-direction:column;gap:12px"></div>

  <div class="actions">
    <button id="copy" type="button">העתקת הרשימה</button>
    <button id="reset" type="button">איפוס הסימונים</button>
  </div>
  <div id="confirm" class="confirm" hidden>

</div>

function lsSet(){ try{ localStorage.setItem('packing-state', JSON.stringify(state)); }catch{} }
state = lsGet();

function items(p){ return PEOPLE[p].cats.flatMap(c=>c[1]); }

function render(){
  const P = PEOPLE[person];
  document.querySelectorAll('.who button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.p===person));
  $('bags').innerHTML = '';
  P.bags.forEach(([v,l])=>{ const d=document.createElement('div'); d.className='bag'; d.innerHTML='<b></b><span></span>'; d.children[0].textContent=v; d.children[1].textContent=l; $('bags').append(d); });
  $('tips').innerHTML = '<ul></ul>';
  P.tips.forEach(t=>{ const li=document.createElement('li'); li.textContent=t; $('tips').firstChild.append(li); });

  const used = new Set(items(person).map(i=>i[3]));
  $('filters').innerHTML='';
  [['all','הכל'],...Object.entries(BAGS).filter(([k])=>used.has(k))].forEach(([k,l])=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=l; b.setAttribute('aria-pressed', filter===k);
    b.onclick=()=>{ filter=k; render(); }; $('filters').append(b);
  });
  if(filter!=='all' && !used.has(filter)) filter='all';

  const list=$('list'); list.innerHTML='';
  P.cats.forEach(([name,its])=>{
    const shown = its.filter(i=>filter==='all'||i[3]===filter);
    if(!shown.length) return;
    const sec=document.createElement('section'); sec.className='cat';
    const doneN = shown.filter(i=>state[i[0]]).length;
    sec.innerHTML='<h2><span class="t"></span><span class="c"></span></h2><ul></ul>';
    sec.querySelector('.t').textContent=name; sec.querySelector('.t').style.color='var(--fg)'; sec.querySelector('.t').style.fontWeight='700';
    sec.querySelector('.c').textContent=doneN+'/'+shown.length;
    shown.forEach(([id,nm,q,bag,note])=>{
      const li=document.createElement('li');
      li.innerHTML='<label class="item"><input type="checkbox"><span class="nm"><b></b><span class="nt"></span></span><span class="meta"><span class="qty"></span><span class="tag"></span></span></label>';
      const cb=li.querySelector('input'); cb.id='cb-'+id; cb.checked=!!state[id];
      li.querySelector('.item').classList.toggle('done', !!state[id]);
      li.querySelector('b').textContent=nm;
      const nt=li.querySelector('.nt'); if(note) nt.textContent=note; else nt.remove();
      li.querySelector('.qty').textContent=/^\d+$/.test(q)?'×'+q:q;
      li.querySelector('.tag').textContent=BAGS[bag];
      cb.onchange=()=>toggle(id, cb.checked);
      sec.querySelector('ul').append(li);
    });
    list.append(sec);
  });
  const all=items(person), d=all.filter(i=>state[i[0]]).length;
  $('count').textContent=d+' / '+all.length+' נארזו';
  $('barfill').style.width=(all.length?d/all.length*100:0)+'%';
}

async function toggle(id, val){
  state[id]=val; render();
  if(db){
    try{ await db.collection('packed').doc(id).set({done:val}); }
    catch(e){ $('sync').textContent='השמירה נכשלה, הסימון נשמר רק במכשיר הזה'; lsSet(); }
  } else lsSet();
}

document.querySelectorAll('.who button').forEach(b=>b.onclick=()=>{ person=b.dataset.p; filter='all'; try{ history.replaceState(null,'','#'+person); }catch{} render(); });
$('copy').onclick=()=>{
  const P=PEOPLE[person];
  const txt=(person==='maya'?'מאיה':'דור')+'\n'+P.cats.map(([n,its])=>n+'\n'+its.map(([id,nm,q,bag])=>(state[id]?'✓ ':'☐ ')+nm+' ×'+q+' ('+BAGS[bag]+')').join('\n')).join('\n\n');
  const done=()=>{ $('copy').textContent='הועתק'; setTimeout(()=>$('copy').textContent='העתקת הרשימה',1500); };
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); else fallbackCopy(txt,done);
};
function fallbackCopy(t,done){ const ta=document.createElement('textarea'); ta.value=t; document.body.append(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch{} ta.remove(); }
$('reset').onclick=()=>{ $('confirm-text').textContent='לאפס את כל הסימונים של '+(person==='maya'?'מאיה':'דור')+'?'; $('confirm').hidden=false; };
$('reset-no').onclick=()=>{ $('confirm').hidden=true; };
$('reset-yes').onclick=async()=>{
  $('confirm').hidden=true;
  const ids=items(person).map(i=>i[0]).filter(id=>state[id]);
  ids.forEach(id=>state[id]=false); render();
  if(db){ for(const id of ids){ try{ await db.collection('packed').doc(id).set({done:false}); }catch{} } } else lsSet();
};

if(['maya','dor'].includes(location.hash.slice(1))) person=location.hash.slice(1);
render();

(async()=>{
  const timer=setTimeout(()=>{ if(!db) $('sync').textContent='נשמר רק במכשיר הזה'; },10000);
  try{
    db = window.claude ? await window.claude.use('db') : null;
  }catch{ db=null; }
  if(!db){ clearTimeout(timer); $('sync').textContent='נשמר רק במכשיר הזה'; return; }
  db.collection('packed').onSnapshot(snap=>{
    clearTimeout(timer);
    const s={}; snap.docs.forEach(d=>{ const v=d.data(); if(v&&v.done) s[d.id]=true; });
    state=s; render();
    $('sync').textContent='משותף לדור ולמאיה';
  }, ()=>{ clearTimeout(timer); $('sync').textContent='אין חיבור, הסימונים נשמרים רק במכשיר הזה'; db=null; });
})();
</script>

</body>
